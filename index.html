<!DOCTYPE html>
<html>
<head>
    <title>Track Example</title>
</head>

<body>

    <div>

    <video controls width="600">

        <source src="selfone.mp4" type="video/mp4">

        <track
            src="self.vtt"
            kind="subtitles"
            srclang="en"
            label="English"
            default>
                 
   

    </video>
 </div>

        <source src="selfone.mp4" type="video/mp4">

        <track
            src="selftel.vtt"
            kind="subtitles"
            srclang="en"
            label="English"
            default>
        
        
           
   

    </video>
 </div>
  <div>
    <video controls width="600">

        <source src="selfone.mp4" type="video/mp4">

        <track
            src="selfhin.vtt"
            kind="subtitles"
            srclang="hi"
            label="English"
            default>
        
        
           
   

    </video>
 </div>
</body>
</html>
