<html>
<head>
 <script>
   function evennum()
   {
   s1=""
    for(i=1;i<=10;i++)
	{
	if(i%2==0)
	    s1=s1+i+"<br>"
	    document.getElementById("result").innerHTML=s1
   }
   } 
   
   </script>
   </head>
   <body>
   <form>
  
   <input type=button value=click onclick="evennum()">
  </form>
 <div id=result></div>
</body>
</html>
