<html>
<head>
<script>
function calculate()
{
    n1 = parseInt(document.getElementById("num1").value);
    n2 = parseInt(document.getElementById("num2").value);
    op = document.getElementById("operator").value;
    switch(op)
    {
        case "+":
            result = n1 + n2;
            break;
        case "-":  
            result = n1 - n2;
            break;
        case "*":
            result = n1 * n2;
            break;
        case "/":
            result = n1 / n2;
            break;
        default:
            result = "";
    }
    document.getElementById("res").value = result;
}
</script>
</head>
<body>
<form>
    <p> calculator</p>
Number 1
<input type="text" id="num1" oninput="calculate()">
Number 2
<input type="text" id="num2" oninput="calculate()">
Operator
<input type="text" id="operator" oninput="calculate()">
Result
<input type="text" id="res">
</form>
</body>
</html>
